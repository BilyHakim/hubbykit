[package]
name = "hubbykit"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = "2"
tempfile = "3"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }
